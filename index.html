<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>One Last Time ❤️</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{

background:#000;
font-family:Arial,sans-serif;
display:flex;
justify-content:center;
align-items:center;
flex-direction:column;
height:100vh;
color:white;

}

h1{

margin:20px;
font-size:32px;
text-align:center;

}

video{

width:90%;
max-width:550px;
border-radius:18px;
box-shadow:0 0 30px rgba(255,255,255,.3);

}

button{

margin-top:20px;
padding:15px 30px;
font-size:18px;
border:none;
border-radius:12px;
cursor:pointer;
background:#ff2d55;
color:white;
transition:.3s;

}

button:hover{

transform:scale(1.05);

}

footer{

margin-top:25px;
font-size:14px;
color:#bbb;

}

</style>

</head>

<body>

<h1>🎬 One Last Time ❤️</h1>

<video id="player" controls autoplay playsinline></video>

<button onclick="playRandom()">
🎲 Play Another Memory
</button>

<footer>
Made with ❤️
</footer>

<script>

const videos=[

encodeURIComponent("WhatsApp Video 2026-07-26 at 9.14.54 PM.mp4"),

encodeURIComponent("WhatsApp Video 2026-07-26 at 9.15.54 PM (1).mp4"),

encodeURIComponent("WhatsApp Video 2026-07-26 at 9.15.54 PM.mp4"),

encodeURIComponent("WhatsApp Video 2026-07-26 at 9.15.55 PM (1).mp4"),

encodeURIComponent("WhatsApp Video 2026-07-26 at 9.15.55 PM.mp4"),

encodeURIComponent("WhatsApp Video 2026-07-26 at 9.15.56 PM (1).mp4"),

encodeURIComponent("WhatsApp Video 2026-07-26 at 9.15.56 PM.mp4"),

encodeURIComponent("WhatsApp Video 2026-07-26 at 9.15.57 PM.mp4"),

encodeURIComponent("WhatsApp Video 2026-07-27 at 10.52.32 PM.mp4")

];

let lastIndex=-1;

function playRandom(){

let random;

do{

random=Math.floor(Math.random()*videos.length);

}while(random===lastIndex && videos.length>1);

lastIndex=random;

const player=document.getElementById("player");

player.src=videos[random];

player.load();

player.play().catch(()=>{});

}

window.onload=playRandom;

</script>

</body>
</html>
